@let current = block();
<section class="inspector__section">
  <label class="inspector__check"
    ><input
      type="checkbox"
      [checked]="current.inheritBusiness"
      (change)="updateHeaderInheritance($event)"
    /><span>Брать бренд из настроек сайта</span></label
  >
  <label class="inspector__field"
    ><span>Название бренда</span
    ><input
      type="text"
      [value]="current.brandName"
      [disabled]="current.inheritBusiness"
      (input)="updateHeaderBrand($event)"
  /></label>
  <app-media-input
    label="Логотип"
    [src]="current.logo?.src ?? ''"
    [alt]="current.logo?.alt ?? ''"
    (srcChange)="updateHeaderLogo('src', $event)"
    (altChange)="updateHeaderLogo('alt', $event)"
  />
  <div class="inspector__grid">
    <label class="inspector__field"
      ><span>CTA</span
      ><input type="text" [value]="current.cta.label" (input)="updateHeaderCta('label', $event)"
    /></label>
  </div>
  <app-page-link-editor
    label="Ссылка CTA"
    [target]="current.cta.target"
    (targetChange)="updateHeaderCtaTarget($event)"
  />
</section>
<section class="inspector__section">
  <div class="inspector__section-head">
    <strong>Меню</strong
    ><button
      mat-icon-button
      type="button"
      aria-label="Добавить пункт меню"
      (click)="addHeaderNavigationItem()"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>
  @for (link of current.navigationItems; track link.id; let index = $index) {
    <details class="inspector__item">
      <summary>{{ link.label || 'Пункт меню' }}</summary>
      <div class="inspector__item-body">
        <app-block-item-actions
          [canMoveUp]="index > 0"
          [canMoveDown]="index < current.navigationItems.length - 1"
          [canRemove]="current.navigationItems.length > 1"
          (moveUp)="moveHeaderNavigationItem(link.id, 'up')"
          (moveDown)="moveHeaderNavigationItem(link.id, 'down')"
          (duplicateItem)="duplicateHeaderNavigationItem(link.id)"
          (removeItem)="removeHeaderNavigationItem(link.id)"
        />
        <label class="inspector__field"
          ><span>Подпись</span
          ><input
            type="text"
            [value]="link.label"
            (input)="updateHeaderNavigationItem(link.id, 'label', $event)"
        /></label>
        <app-page-link-editor
          [target]="link.target"
          (targetChange)="updateHeaderNavigationTarget(link.id, $event)"
        />
        <label class="inspector__check"
          ><input
            type="checkbox"
            [checked]="link.openInNewTab"
            (change)="toggleHeaderNavigationTarget(link.id, $event)"
          /><span>Открывать в новой вкладке</span></label
        >
      </div>
    </details>
  }
</section>
