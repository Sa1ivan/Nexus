@let current = block();
<section class="inspector__section">
  <label class="inspector__field"
    ><span>Надзаголовок</span
    ><input
      type="text"
      [value]="current.eyebrow"
      (input)="updateOfferText('eyebrow', $event)" /></label
  ><label class="inspector__field"
    ><span>Заголовок</span
    ><textarea
      rows="3"
      [value]="current.title"
      (input)="updateOfferText('title', $event)"
    ></textarea>
  </label>
</section>
<section class="inspector__section">
  <div class="inspector__section-head">
    <strong>Предложения</strong
    ><button
      mat-icon-button
      type="button"
      aria-label="Добавить предложение"
      (click)="addOfferItem()"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>
  @for (item of current.items; track item.id; let index = $index) {
    <details class="inspector__item">
      <summary>{{ item.title }}</summary>
      <div class="inspector__item-body">
        <app-block-item-actions
          [canMoveUp]="index > 0"
          [canMoveDown]="index < current.items.length - 1"
          [canRemove]="current.items.length > 1"
          (moveUp)="moveOfferItem(item.id, 'up')"
          (moveDown)="moveOfferItem(item.id, 'down')"
          (duplicateItem)="duplicateOfferItem(item.id)"
          (removeItem)="removeOfferItem(item.id)"
        />
        <label class="inspector__field"
          ><span>Название</span
          ><input
            type="text"
            [value]="item.title"
            (input)="updateOfferItemText(item.id, 'title', $event)"
        /></label>
        <div class="inspector__grid">
          <label class="inspector__field"
            ><span>Мета</span
            ><input
              type="text"
              [value]="item.meta"
              (input)="updateOfferItemText(item.id, 'meta', $event)" /></label
          ><label class="inspector__field"
            ><span>Цена</span
            ><input
              type="text"
              [value]="item.price ?? ''"
              (input)="updateOfferItemText(item.id, 'price', $event)"
          /></label>
        </div>
        <label class="inspector__field"
          ><span>Бейдж</span
          ><input
            type="text"
            [value]="item.badge ?? ''"
            (input)="updateOfferItemText(item.id, 'badge', $event)"
        /></label>
        <label class="inspector__field"
          ><span>Описание</span
          ><textarea
            rows="3"
            [value]="item.description"
            (input)="updateOfferItemText(item.id, 'description', $event)"
          ></textarea>
        </label>
        <app-media-input
          label="Изображение"
          [src]="item.image?.src ?? ''"
          [alt]="item.image?.alt ?? ''"
          (srcChange)="updateOfferImage(item.id, 'src', $event)"
          (altChange)="updateOfferImage(item.id, 'alt', $event)"
        />
        <div class="inspector__grid">
          <label class="inspector__field"
            ><span>CTA</span
            ><input
              type="text"
              [value]="item.cta?.label ?? ''"
              (input)="updateOfferCta(item.id, 'label', $event)" /></label
          ><label class="inspector__field"
            ><span>Ссылка</span
            ><input
              type="text"
              [value]="item.cta?.target ?? ''"
              (input)="updateOfferCta(item.id, 'target', $event)"
          /></label>
        </div>
      </div>
    </details>
  }
</section>
