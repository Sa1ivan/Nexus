@let current = block();
<section class="inspector__section">
  <label class="inspector__field"
    ><span>Заголовок</span
    ><textarea
      rows="3"
      [value]="current.title"
      (input)="updateHeroText('title', $event)"
    ></textarea>
  </label>
  <label class="inspector__field"
    ><span>Описание</span
    ><textarea
      rows="4"
      [value]="current.subtitle"
      (input)="updateHeroText('subtitle', $event)"
    ></textarea>
  </label>
  <div class="inspector__grid">
    <label class="inspector__field"
      ><span>Главная кнопка</span
      ><input
        type="text"
        [value]="current.buttonText"
        (input)="updateHeroText('buttonText', $event)" /></label
    ><label class="inspector__field"
      ><span>Ссылка</span
      ><input
        type="text"
        [value]="current.buttonHref"
        list="block-anchors"
        (input)="updateHeroText('buttonHref', $event)"
    /></label>
  </div>
  <div class="inspector__grid">
    <label class="inspector__field"
      ><span>Вторая кнопка</span
      ><input
        type="text"
        [value]="current.secondaryButton?.label ?? ''"
        (input)="updateHeroSecondary('label', $event)" /></label
    ><label class="inspector__field"
      ><span>Ссылка</span
      ><input
        type="text"
        [value]="current.secondaryButton?.target ?? ''"
        list="block-anchors"
        (input)="updateHeroSecondary('target', $event)"
    /></label>
  </div>
  <app-media-input
    label="Изображение"
    [src]="current.media?.src ?? ''"
    [alt]="current.media?.alt ?? ''"
    (srcChange)="updateHeroMedia('src', $event)"
    (altChange)="updateHeroMedia('alt', $event)"
  />
</section>
