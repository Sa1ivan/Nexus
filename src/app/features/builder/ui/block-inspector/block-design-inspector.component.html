@let currentBlock = block();
<section class="inspector__section">
  <h2>Оформление секции</h2>
  <div class="inspector__color-grid">
    <label class="inspector__color"
      ><span>Фон</span
      ><input
        type="color"
        [value]="currentBlock.appearance?.backgroundColor ?? siteConfig().theme.surfaceColor"
        (input)="updateAppearanceColor('backgroundColor', $event)"
    /></label>
    <label class="inspector__color"
      ><span>Текст</span
      ><input
        type="color"
        [value]="currentBlock.appearance?.textColor ?? siteConfig().theme.textColor"
        (input)="updateAppearanceColor('textColor', $event)"
    /></label>
    <label class="inspector__color"
      ><span>Акцент</span
      ><input
        type="color"
        [value]="currentBlock.appearance?.accentColor ?? siteConfig().theme.accentColor"
        (input)="updateAppearanceColor('accentColor', $event)"
    /></label>
  </div>
  <div class="inspector__grid">
    <div class="inspector__field">
      <span>Ширина</span>
      <app-settings-select
        ariaLabel="Ширина секции"
        [options]="contentWidthOptions"
        [value]="currentBlock.appearance?.contentWidth ?? siteConfig().theme.contentWidth"
        (valueChange)="updateAppearanceWidth($event)"
      />
    </div>
    <div class="inspector__field">
      <span>Отступы</span>
      <app-settings-select
        ariaLabel="Отступы секции"
        [options]="sectionSpacingOptions"
        [value]="currentBlock.appearance?.spacing ?? siteConfig().theme.sectionSpacing"
        (valueChange)="updateAppearanceSpacing($event)"
      />
    </div>
  </div>
  <label class="inspector__field"
    ><span>Радиус: {{ currentBlock.appearance?.radius ?? siteConfig().theme.radius }} px</span
    ><input
      type="range"
      min="0"
      max="32"
      [value]="currentBlock.appearance?.radius ?? siteConfig().theme.radius"
      (input)="updateAppearanceRadius($event)"
  /></label>
</section>
<section class="inspector__section">
  <h2>Характер блока</h2>
  <div class="inspector__swatches">
    @for (option of accentOptions; track option.id) {
      <button
        type="button"
        [class.is-active]="selectedDesign().accentColor === option.id"
        [style.--swatch]="getAccentValue(option.id)"
        [attr.aria-label]="option.title"
        (click)="updateBlockAccent(option.id)"
      ></button>
    }
  </div>
  <div class="inspector__field">
    <span>Шрифт</span>
    <app-settings-select
      ariaLabel="Шрифт блока"
      [options]="fontSelectOptions"
      [value]="selectedDesign().fontPairing"
      (valueChange)="updateBlockFontSelection($event)"
    />
  </div>
  <div class="inspector__field">
    <span>Плотность</span>
    <app-settings-select
      ariaLabel="Плотность блока"
      [options]="densitySelectOptions"
      [value]="selectedDesign().density"
      (valueChange)="updateBlockDensitySelection($event)"
    />
  </div>
  <div class="inspector__field">
    <span>Стиль</span>
    <app-settings-select
      ariaLabel="Стиль блока"
      [options]="templateStyleSelectOptions"
      [value]="selectedDesign().templateStyle"
      (valueChange)="updateBlockTemplateStyleSelection($event)"
    />
  </div>
  @if (currentBlock.type === 'hero') {
    <div class="inspector__color-grid">
      <label class="inspector__color"
        ><span>Hero фон</span
        ><input
          type="color"
          [value]="currentBlock.styles.backgroundColor"
          (input)="updateHeroStyle('backgroundColor', $event)" /></label
      ><label class="inspector__color"
        ><span>Hero текст</span
        ><input
          type="color"
          [value]="currentBlock.styles.textColor"
          (input)="updateHeroStyle('textColor', $event)"
      /></label>
    </div>
    <label class="inspector__field"
      ><span>Минимальная высота</span
      ><input
        type="text"
        [value]="currentBlock.styles.minHeight"
        (input)="updateHeroStyle('minHeight', $event)"
    /></label>
  }
</section>
<app-block-button-design-inspector [block]="currentBlock" />
