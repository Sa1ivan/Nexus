<div class="wizard-preview">
  <div class="wizard-preview__bar">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="wizard-preview__status">
    <span>{{ stepLabel() }}</span>
    <strong>{{ brandName() }}</strong>
  </div>

  <div class="wizard-preview__body">
    <app-block-renderer
      [blocks]="siteConfig().pages[0]?.blocks ?? []"
      [theme]="siteConfig().theme"
    />
  </div>
</div>
