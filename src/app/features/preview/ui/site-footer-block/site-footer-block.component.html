<footer
  [id]="block().anchor"
  class="site-footer"
  [class.site-footer--map]="block().variant === 'contactMap'"
  [class.site-footer--compact]="block().variant === 'compactLegal'"
  [class.site-footer--social]="block().variant === 'socialLead'"
  [class.site-footer--booking]="block().variant === 'bookingFooter'"
  [class.site-footer--editorial]="design().templateStyle === 'editorial'"
  [class.site-footer--conversion]="design().templateStyle === 'conversion'"
  [style.--landing-accent]="accentColor()"
  [style.--landing-font]="fontFamily()"
  [style.--landing-radius]="radiusValue()"
  [style.--landing-section-y]="sectionPaddingY()"
>
  <div class="site-footer__main">
    <div>
      <strong class="site-footer__brand">{{ block().brandName }}</strong>
      <a class="site-footer__cta" [href]="block().cta.target">{{ block().cta.label }}</a>
    </div>

    <address class="site-footer__contacts">
      @for (line of block().contactLines; track line) {
        <span>{{ line }}</span>
      }
    </address>

    @if (block().variant === 'contactMap') {
      @if (block().map; as map) {
        <a class="site-footer__map" [href]="map.embedUrl" target="_blank" rel="noreferrer">
          <span>{{ map.label }}</span>
          <strong>{{ map.address }}</strong>
        </a>
      }
    }
  </div>

  <div class="site-footer__bottom">
    @for (link of block().links; track link) {
      <a [href]="link.target">{{ link.label }}</a>
    }
  </div>
</footer>
