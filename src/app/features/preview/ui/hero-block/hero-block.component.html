<section
  [id]="block().anchor"
  class="hero-block"
  [class.hero-block--left]="block().styles.alignment === 'left'"
  [class.hero-block--center]="block().styles.alignment === 'center'"
  [class.hero-block--right]="block().styles.alignment === 'right'"
  [class.hero-block--cover]="layoutVariant() === 'cover'"
  [class.hero-block--minimal]="layoutVariant() === 'minimal'"
  [class.hero-block--split]="layoutVariant() === 'split'"
  [style.min-height]="block().styles.minHeight"
  [style.--hero-cover-overlay]="coverOverlay()"
>
  <div class="hero-block__layout">
    <div class="hero-block__content">
      <h1 class="hero-block__title">{{ block().title }}</h1>
      <p class="hero-block__subtitle">{{ block().subtitle }}</p>
      <div class="hero-block__actions">
        <a
          class="hero-block__button"
          [class.hero-block__button--outline]="block().styles.buttonVariant === 'outline'"
          [class.hero-block__button--ghost]="block().styles.buttonVariant === 'ghost'"
          [appLandingLink]="block().buttonHref"
          [style.--hero-button-background]="block().styles.buttonBackgroundColor"
          [style.--hero-button-text]="block().styles.buttonTextColor"
        >
          {{ block().buttonText }}
        </a>

        @if (block().secondaryButton; as secondaryButton) {
          <a
            class="hero-block__button hero-block__button--secondary"
            [appLandingLink]="secondaryButton.target"
            [attr.target]="secondaryButton.openInNewTab ? '_blank' : null"
            [attr.rel]="secondaryButton.openInNewTab ? 'noopener noreferrer' : null"
          >
            {{ secondaryButton.label }}
          </a>
        }
      </div>
    </div>

    @if (block().media; as media) {
      <figure class="hero-block__media">
        <img [src]="media.src" [alt]="media.alt" [style.object-position]="mediaObjectPosition()" />
      </figure>
    }
  </div>
</section>
