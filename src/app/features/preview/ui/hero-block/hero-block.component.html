<section
  [id]="block().anchor"
  class="hero-block"
  [class.hero-block--left]="block().styles.alignment === 'left'"
  [class.hero-block--center]="block().styles.alignment === 'center'"
  [class.hero-block--right]="block().styles.alignment === 'right'"
  [style.background-color]="block().styles.backgroundColor"
  [style.color]="block().styles.textColor"
  [style.font-family]="fontFamily()"
  [style.min-height]="block().styles.minHeight"
  [style.--landing-radius]="radiusValue()"
  [style.--landing-section-y]="sectionPaddingY()"
>
  <div class="hero-block__content">
    <h1 class="hero-block__title">{{ block().title }}</h1>
    <p class="hero-block__subtitle">{{ block().subtitle }}</p>
    <a
      class="hero-block__button"
      [href]="block().buttonHref"
      [style.background-color]="block().styles.buttonBackgroundColor"
      [style.color]="block().styles.buttonTextColor"
    >
      {{ block().buttonText }}
    </a>
  </div>
</section>
