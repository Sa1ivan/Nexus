@if (loading()) {
  <main class="public-preview public-preview--missing">
    <section>
      <span>Nexus</span>
      <h1>Загружаем публикацию</h1>
      <p>Подготавливаем последнюю опубликованную версию сайта.</p>
    </section>
  </main>
} @else if (release(); as publishedRelease) {
  <main class="public-preview">
    <app-block-renderer
      [blocks]="publishedRelease.siteConfig.pages[0]?.blocks ?? []"
      [theme]="publishedRelease.siteConfig.theme"
      [projectId]="projectId()"
      (leadSubmit)="submitLead($event)"
    />
  </main>
} @else {
  <main class="public-preview public-preview--missing">
    <section>
      <span>Nexus</span>
      <h1>Публикация не найдена</h1>
      <p>Проект еще не опубликован или ссылка устарела.</p>
      <a routerLink="/builder">Вернуться в конструктор</a>
    </section>
  </main>
}
